<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background — dark ink -->
  <rect width="512" height="512" fill="oklch(0.22 0.012 60)" rx="96"/>
  <!-- hotel building silhouette -->
  <g fill="oklch(0.55 0.115 40)" transform="translate(128 96)">
    <!-- main building -->
    <rect x="0" y="80" width="256" height="240" rx="8"/>
    <!-- roof / pediment -->
    <polygon points="0,80 128,16 256,80"/>
    <!-- windows grid (paper-colored) -->
    <g fill="oklch(0.985 0.005 75)">
      <rect x="32"  y="112" width="32" height="40" rx="3"/>
      <rect x="80"  y="112" width="32" height="40" rx="3"/>
      <rect x="144" y="112" width="32" height="40" rx="3"/>
      <rect x="192" y="112" width="32" height="40" rx="3"/>
      <rect x="32"  y="168" width="32" height="40" rx="3"/>
      <rect x="80"  y="168" width="32" height="40" rx="3"/>
      <rect x="144" y="168" width="32" height="40" rx="3"/>
      <rect x="192" y="168" width="32" height="40" rx="3"/>
      <rect x="32"  y="224" width="32" height="40" rx="3"/>
      <rect x="192" y="224" width="32" height="40" rx="3"/>
    </g>
    <!-- door -->
    <rect x="104" y="224" width="48" height="96" rx="4" fill="oklch(0.985 0.005 75)"/>
    <circle cx="138" cy="276" r="2.5" fill="oklch(0.22 0.012 60)"/>
  </g>
</svg>
